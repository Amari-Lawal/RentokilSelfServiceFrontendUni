name: Deploy Frontend to Cloud Run

on:
  push:
    branches:
      - main
      - dev
      - test
    paths:
      - 'frontend/**' # Triggers only when frontend code changes
      - '.github/workflows/deploy-frontend.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: europe-west1
  REPOSITORY: rentokil-uni-registry
  # Logic: 'main' branch becomes 'prod', others keep their name (dev/test)
  ENV_NAME: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Selects the GitHub Environment (prod/dev/test) to pull correct secrets
    environment: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Authorize Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and Push Container
        run: |-
          SERVICE_NAME="rentokil-frontend-uni-${{ env.ENV_NAME }}"
          # Use the backend URL secret you've set in your GitHub Environment
          # Vite requires this at BUILD TIME to bake it into the JS
          IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${SERVICE_NAME}:${{ github.sha }}"
          
          docker build \
            --build-arg VITE_API_URL="${{ secrets.BACKEND_URL }}" \
            -t "$IMAGE_TAG" . 
          
          docker push "$IMAGE_TAG"

      - name: Deploy to Cloud Run # Test2
        uses: 'google-github-actions/deploy-cloudrun@v2'
        with:
          service: rentokil-frontend-uni-${{ env.ENV_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/rentokil-frontend-uni-${{ env.ENV_NAME }}:${{ github.sha }}
          flags: '--allow-unauthenticated'