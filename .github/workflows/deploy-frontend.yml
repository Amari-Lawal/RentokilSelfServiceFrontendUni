name: Deploy Frontend to Cloud Run

on:
  push:
    branches:
      - main
      - dev
      - test

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:  
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: europe-west1
  REPOSITORY: rentokil-uni-registry
  ENV_NAME: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}

jobs:
  test:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Set VITE_API_URL
        run: |
          REF_NAME="${{ github.ref_name }}"
          if [ "$REF_NAME" == "main" ]; then
            echo "VITE_API_URL=${{ secrets.PROD_BACKEND_URL }}" >> $GITHUB_ENV
          elif [ "$REF_NAME" == "dev" ]; then
            echo "VITE_API_URL=${{ secrets.DEV_BACKEND_URL }}" >> $GITHUB_ENV
          elif [ "$REF_NAME" == "test" ]; then
            echo "VITE_API_URL=${{ secrets.TEST_BACKEND_URL }}" >> $GITHUB_ENV
          else
            echo "VITE_API_URL=${{ secrets.DEV_BACKEND_URL }}" >> $GITHUB_ENV
          fi

      - name: Run Playwright tests
        run: npx playwright test --workers 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Authorize Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Set VITE_API_URL
        run: |
          if [ "${{ env.ENV_NAME }}" == "prod" ]; then
            echo "VITE_API_URL=${{ secrets.PROD_BACKEND_URL }}" >> $GITHUB_ENV
          elif [ "${{ env.ENV_NAME }}" == "dev" ]; then
            echo "VITE_API_URL=${{ secrets.DEV_BACKEND_URL }}" >> $GITHUB_ENV
          elif [ "${{ env.ENV_NAME }}" == "test" ]; then
            echo "VITE_API_URL=${{ secrets.TEST_BACKEND_URL }}" >> $GITHUB_ENV
          else
            echo "VITE_API_URL=${{ secrets.DEV_BACKEND_URL }}" >> $GITHUB_ENV
          fi

      - name: Build and Push Container
        run: |-
          SERVICE_NAME="rentokil-frontend-uni-${{ env.ENV_NAME }}"
          IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${SERVICE_NAME}:${{ github.sha }}"
          docker build \
            --build-arg VITE_API_URL=${{ env.VITE_API_URL }} \
            -t "$IMAGE_TAG" \
            -f Dockerfile.prod .
          docker push "$IMAGE_TAG"

      - name: Deploy to Cloud Run # test
        uses: 'google-github-actions/deploy-cloudrun@v2'
        with:
          service: rentokil-frontend-uni-${{ env.ENV_NAME }}
          region: ${{ env.REGION }}
          flags: '--allow-unauthenticated'
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/rentokil-frontend-uni-${{ env.ENV_NAME }}:${{ github.sha }}
